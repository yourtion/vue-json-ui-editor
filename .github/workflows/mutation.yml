name: CI - Mutation Testing

# PRs keep the ordinary CI checks; mutation runs on main or by manual dispatch.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full run (only main updates the shared baseline)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUTATION_NODE_VERSION: "24"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.MUTATION_NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types, formatting and original coverage
        run: |
          pnpm exec biome check src/
          pnpm type-check
          pnpm exec vitest run --coverage

      # Source and tests are semantic inputs; the local guard checks restored reports too.
      - name: Show baseline input manifest
        run: node .github/scripts/baseline-inputs.mjs .github/mutation-cache-inputs.json --list

      - name: Compute baseline compatibility key
        id: baseline-key
        run: |
          INPUTS_HASH="$(node .github/scripts/baseline-inputs.mjs .github/mutation-cache-inputs.json)"
          echo "prefix=mutation-vue-json-v3-${RUNNER_OS}-node${MUTATION_NODE_VERSION}-${INPUTS_HASH}" >> "$GITHUB_OUTPUT"

      # Branch dispatches may read main caches; only successful main runs save.
      - name: Restore main mutation baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.json.inputs.json
          key: ${{ steps.baseline-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.baseline-key.outputs.prefix }}-

      - name: Explain baseline availability
        env:
          CACHE_MATCH: ${{ steps.baseline.outputs.cache-matched-key }}
        run: |
          if [ -z "$CACHE_MATCH" ]; then
            echo "No compatible trusted main baseline: running full configured scope." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Restored main baseline: $CACHE_MATCH; the semantic guard validates reuse." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run mutation tests
        env:
          FORCE_FULL: ${{ inputs.full == true }}
        run: |
          if [ "$FORCE_FULL" = "true" ]; then
            pnpm mutation:full
          else
            # The guard rejects missing or incompatible report metadata.
            pnpm mutation
          fi

      - name: Save main mutation baseline
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.json.inputs.json
          key: ${{ steps.baseline.outputs.cache-primary-key }}

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
